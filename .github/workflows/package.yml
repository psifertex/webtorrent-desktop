name: package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach artifacts to (e.g. v0.24.1). Leave empty to only produce ephemeral workflow artifacts.'
        type: string
        required: false
        default: ''

# Needed for `gh release upload` against an existing release. Without
# contents:write the default GITHUB_TOKEN gets HTTP 403 from the
# releases API.
permissions:
  contents: write

jobs:
  package_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run package -- linux --skipInstall
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.zip
      - name: Upload to release
        if: ${{ inputs.release_tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.deb dist/*.rpm dist/*.zip)
          gh release upload "${{ inputs.release_tag }}" "${files[@]}" --clobber

  package_macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Universal Mach-O: single .app that runs natively on Intel + Apple Silicon.
      # Use --package=zip to avoid the legacy appdmg@^0.6.0 dependency, which is
      # known to break on modern macOS runners.
      - run: npm run package -- darwin --arch=universal --package=zip --skipInstall
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: dist/*.zip
      - name: Upload to release
        if: ${{ inputs.release_tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.zip)
          gh release upload "${{ inputs.release_tag }}" "${files[@]}" --clobber

  package_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run package -- win32 --skipInstall
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.nupkg
            dist/*.zip
      - name: Upload to release
        if: ${{ inputs.release_tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.nupkg dist/*.zip)
          gh release upload "${{ inputs.release_tag }}" "${files[@]}" --clobber
